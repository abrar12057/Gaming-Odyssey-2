<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>⚽ Pro Striker – Ultimate Football</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <style>
        #loadingScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, #0f1720, #06070a);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            font-family: 'Outfit', sans-serif;
            transition: opacity 0.8s ease;
        }
        #loadingScreen.hidden { opacity: 0; pointer-events: none; }
        .loader { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #f1c40f; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loadingScreen h1 { color: white; font-size: 32px; margin-top: 30px; background: linear-gradient(135deg, #f1c40f, #e74c3c); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #loadingScreen p { color: rgba(255,255,255,0.5); margin-top: 10px; font-size: 14px; }
        .progress-bar { width: 200px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 20px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f1c40f, #e74c3c); border-radius: 2px; transition: width 0.3s ease; }
        
        #gameWrapper {
            /* Kept in sync with .game-wrapper in style.css — see the
               detailed comment there. Fills the viewport at a locked 3:2
               ratio instead of capping out at a fixed 900x600, and uses
               100dvh (with 100vh fallback) so iPhone Safari's always-visible
               address bar doesn't clip the bottom of the game off-screen. */
            position: relative;
            width: min(100vw, calc(100vh * 3 / 2));
            width: min(100vw, calc(100dvh * 3 / 2));
            height: min(100vh, calc(100vw * 2 / 3));
            height: min(100dvh, calc(100vw * 2 / 3));
            aspect-ratio: 3/2;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 60px rgba(0,0,0,0.85), inset 0 0 60px rgba(255,255,255,0.02);
            background: linear-gradient(180deg, #11121b 0%, #101226 60%);
            flex-shrink: 0;
            touch-action: none;
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0b0f19;
            image-rendering: auto;
            touch-action: none;
        }
    </style>
</head>
<body>
    <!-- CRAZYGAMES BUILD: no custom fullscreen button. CrazyGames auto-
         provides fullscreen and explicitly prohibits custom in-game
         fullscreen buttons/controls ("can interfere with other features
         e.g. monetization" — see requirements doc). Poki's build keeps the
         button; this build (see index.html for CrazyGames) omits it
         entirely rather than just hiding it, so there's no dead code or
         confusing unused markup left behind. -->
    <!-- Deliberately a sibling of #gameWrapper, not a child of it. The game
         canvas is locked to a 3:2 box (see .game-wrapper in style.css) and on
         most phone aspect ratios that box doesn't reach every screen edge —
         if the joystick/shoot buttons were positioned relative to that box
         (like they used to be), they'd sit inset from the real screen edges
         by however much letterbox margin existed, forcing thumbs to reach
         inward instead of resting naturally at the edges of the phone. As a
         direct child of <body> with position:fixed (see .touch-controls in
         style.css), they anchor to the actual viewport instead, so they're
         always right at the true screen edges regardless of the letterbox. -->
    <div id="touchControls" class="touch-controls mode-1v1">
        <div id="p1Joystick" class="joystick-base p1-joy"><div class="joystick-stick"></div></div>
        <button id="p1Shoot" class="shoot-btn p1-shoot" aria-label="Shoot P1">⚽</button>
        <div id="p2Joystick" class="joystick-base p2-joy"><div class="joystick-stick"></div></div>
        <button id="p2Shoot" class="shoot-btn p2-shoot" aria-label="Shoot P2">⚽</button>
    </div>
    <div id="rotateWarning" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; height:100dvh; background:rgba(0,0,0,0.92); z-index:200; justify-content:center; align-items:center; flex-direction:column; color:white; text-align:center; padding:20px; font-family:'Outfit',sans-serif;">
        <div style="font-size:48px; margin-bottom:20px;">📱</div>
        <h2 style="margin-bottom:10px;">Please Rotate Your Device</h2>
        <p style="opacity:0.7; max-width:300px;">Pro Striker works best in landscape mode. Rotate your phone for the best experience.</p>
    </div>
    <div id="gameWrapper" class="game-wrapper">
        <div id="loadingScreen">
            <div class="loader"></div>
            <h1>⚽ PRO STRIKER</h1>
            <p>Loading the beautiful game...</p>
            <div class="progress-bar"><div class="progress-fill" id="loadProgress"></div></div>
        </div>
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div id="goalFlash" class="goal-flash"></div>
        <div id="celebrationOverlay" class="celebration-overlay"></div>
    </div>

    <script src="js/globals.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/tournamentData.js"></script>
    <script src="js/tournament.js"></script>
    <script src="js/input.js"></script>
    <script src="js/main.js"></script>

    <script>
        // ===== SITELOCK (CrazyGames build only) =====
        // Prevents this build from running if the page it's loaded on isn't
        // an actual CrazyGames domain — stops someone from ripping the game
        // files and rehosting them elsewhere as-is. Per CrazyGames' own
        // Sitelock doc: https://docs.crazygames.com/resources/html5/sitelock/
        // IMPORTANT: this check is specific to THIS CrazyGames build. If
        // this same project is packaged for Poki, itch.io, or anywhere
        // else, this block must be removed from that copy — it would
        // otherwise block the game from ever loading there too.
        function isCrazyGames() {
            const hostname = window.location.hostname;
            const parts = hostname.split(".");
            const idx = parts.indexOf("crazygames");
            return idx !== -1 && idx >= parts.length - 3;
        }
        // Also allow localhost/127.0.0.1 so local dev testing (like this
        // file being opened directly, or via a local dev server) still
        // works — only a real, non-CrazyGames public domain gets blocked.
        function isLocalDev() {
            const h = window.location.hostname;
            return h === 'localhost' || h === '127.0.0.1' || h === '' || h === '[::1]';
        }
        const siteLockPassed = isCrazyGames() || isLocalDev();

        let progress = 0;
        const loadInterval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress > 100) progress = 100;
            document.getElementById('loadProgress').style.width = progress + '%';
            if (progress >= 100) {
                clearInterval(loadInterval);
                setTimeout(() => document.getElementById('loadingScreen').classList.add('hidden'), 500);
            }
        }, 100);

        window.addEventListener('load', () => {
            if (!siteLockPassed) {
                clearInterval(loadInterval);
                const loadingScreen = document.getElementById('loadingScreen');
                if (loadingScreen) {
                    loadingScreen.innerHTML =
                        '<h1>⚽ PRO STRIKER</h1><p>Available only on CrazyGames.</p>';
                    loadingScreen.classList.remove('hidden');
                }
                return; // bootstrap() is never called — game never starts
            }
            const tryStart = () => {
                if (typeof window.bootstrap === 'function') window.bootstrap();
                else setTimeout(tryStart, 50);
            };
            tryStart();
        });

        function checkOrientation() {
            const warning = document.getElementById('rotateWarning');
            if (!warning) return;
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || window.innerWidth < 768;
            const isPortrait = window.innerHeight > window.innerWidth;
            if (isMobile && isPortrait) {
                warning.style.display = 'flex';
            } else {
                warning.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', checkOrientation);
        checkOrientation();

        // NOTE (CrazyGames build): no custom fullscreen toggle here — see the
        // comment on the removed button in the <body> above. CrazyGames
        // handles fullscreen entirely on their end; this game doesn't need
        // to request or manage it at all.
    </script>
</body>
</html>
